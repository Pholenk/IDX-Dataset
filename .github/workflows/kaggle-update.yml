name: Push dataset to Kaggle

on:
  push:
    branches: [main]
    paths:
      - 'dataset/**'
      - 'dataset-metadata.json'
      - 'metadata.json'

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Setup Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"pholenk\",\"key\":\"${{ secrets.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Upload dataset
        run: |
          kaggle datasets version \
            -p . \
            -m "Update: ${{ github.event.head_commit.message }}" \
            --dir-mode zip
